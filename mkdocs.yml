site_name: AMP
site_description: AMP (Another Music Player), a desktop player for the YouTube Music library
repo_url: https://github.com/Alxiice/AMP
repo_name: Alxiice/AMP
edit_uri: edit/master/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-square.svg
  favicon: assets/logo-square.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Dark first: it is the app's default look. Colours: docs/stylesheets/amp.css
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/amp.css
extra_javascript:
  - javascripts/home.js

plugins:
  - search
  - glightbox:
      skip_classes:
        - skip-lightbox

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Alxiice/AMP
      name: AMP on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Usage:
      - usage/index.md
      - Install & launch: usage/install.md
      - Using the app: usage/using-the-app.md
      - Signing in: usage/sign-in.md
      - Configuration: usage/configuration.md
      - OBS now-playing widget: usage/obs-widget.md
      - Developer launcher: usage/launcher.md
      - Troubleshooting: usage/troubleshooting.md
      - Manual runs: usage/debugging.md
  - Code:
      - code/index.md
      - Repository layout: code/layout.md
      - Backend:
          - code/backend/index.md
          - HTTP API: code/backend/api.md
          - Stream extraction: code/backend/extraction.md
          - Segment table: code/backend/segment-table.md
          - Download pipeline: code/backend/pipeline.md
          - Cache & database: code/backend/cache.md
          - Serving & playback: code/backend/serving.md
          - Authentication: code/backend/auth.md
          - Process lifecycle: code/backend/lifecycle.md
      - Frontend:
          - code/frontend/index.md
          - Player: code/frontend/player.md
          - Tauri shell: code/frontend/tauri.md
      - Development:
          - Testing: code/development/testing.md
          - CI & packaging: code/development/ci-packaging.md
          - Pitfalls: code/development/pitfalls.md
