[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amp-v2"
version = "2.0.0"
description = "AMP v2 — YouTube Music DASH-segment streaming desktop app"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0,<1",
    "uvicorn[standard]>=0.27.0,<1",
    "sqlalchemy>=2.0.0,<3",
    "pydantic>=2.5.0,<3",
    "pydantic-settings>=2.1.0,<3",
    "requests>=2.31.0,<3",
    "yt-dlp[default]>=2026.10.26",
    "ytmusicapi>=1.6.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "httpx>=0.26.0,<1",
]
packaging = [
    "pyinstaller>=6.3.0,<7",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration (network + cookies required)",
]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
