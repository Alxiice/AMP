[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amp-v2"
version = "2.0.0"
description = "AMP v2 — YouTube Music DASH-segment streaming desktop app"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0,<1",
    "uvicorn[standard]>=0.27.0,<1",
    "sqlalchemy>=2.0.0,<3",
    "pydantic>=2.5.0,<3",
    "pydantic-settings>=2.1.0,<3",
    "requests>=2.31.0,<3",
    "yt-dlp[default]>=2026.10.26",
    "ytmusicapi>=1.6.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "httpx>=0.26.0,<1",
    "pytest-cov>=5,<8",
    "ruff>=0.5",
]
packaging = [
    "pyinstaller>=6.3.0,<7",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration (network + cookies required)",
]
testpaths = ["backend/tests"]

# Coverage: pytest -m "not integration" --cov=backend --cov-report=term-missing
[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 60  # regression floor (63% at Revision 8); raise as coverage grows
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
