[package]
name = "amp-v2"
version = "2.0.0"
description = "AMP v2 — YouTube Music DASH-segment streaming desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }  # sidecar spawning comes from tauri-plugin-shell
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
