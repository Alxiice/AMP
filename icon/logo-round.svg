<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient (Light source top-right pinkish, dark blue bottom-left) -->
    <radialGradient id="circleBgGrad" cx="75%" cy="25%" r="85%" fx="80%" fy="20%">
      <stop offset="0%" stop-color="#FF38BB" />
      <stop offset="30%" stop-color="#CE12D3" />
      <stop offset="65%" stop-color="#1B3FB8" />
      <stop offset="100%" stop-color="#0A1852" />
    </radialGradient>

    <!-- Play Icon Linear/Diagonal Gradient -->
    <linearGradient id="playGradCircle" x1="20%" y1="90%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#A78BFA" />
      <stop offset="85%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FF9EE2" />
    </linearGradient>

    <!-- Drop Shadow for Play Button -->
    <filter id="shadowCircle" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-8" dy="16" stdDeviation="14" flood-color="#030826" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Base Container -->
  <circle cx="250" cy="250" r="220" fill="url(#circleBgGrad)" />

  <!-- Rounded Play Triangle -->
  <path d="M 210,145 
           C 220,145 228,150 235,155 
           L 350,228 
           C 365,238 365,262 350,272 
           L 235,345 
           C 228,350 220,355 210,355 
           C 192,355 180,340 180,320 
           L 180,180 
           C 180,160 192,145 210,145 Z" fill="url(#playGradCircle)" filter="url(#shadowCircle)" />
</svg>