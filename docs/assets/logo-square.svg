<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="squircleBgGrad" cx="78%" cy="22%" r="85%" fx="82%" fy="18%">
      <stop offset="0%" stop-color="#FF3A8C" />
      <stop offset="28%" stop-color="#CF15D4" />
      <stop offset="65%" stop-color="#1D3BB5" />
      <stop offset="100%" stop-color="#091448" />
    </radialGradient>

    <!-- Play Icon Gradient -->
    <linearGradient id="playGradSquircle" x1="20%" y1="90%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#A78BFA" />
      <stop offset="85%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FF9EE2" />
    </linearGradient>

    <!-- Drop Shadow for Play Button -->
    <filter id="shadowSquircle" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-8" dy="16" stdDeviation="14" flood-color="#020721" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Square (Squircle) Base Container -->
  <rect x="30" y="30" width="440" height="440" rx="110" ry="110" fill="url(#squircleBgGrad)" />

  <!-- Rounded Play Triangle -->
  <path d="M 210,145 
           C 220,145 228,150 235,155 
           L 350,228 
           C 365,238 365,262 350,272 
           L 235,345 
           C 228,350 220,355 210,355 
           C 192,355 180,340 180,320 
           L 180,180 
           C 180,160 192,145 210,145 Z" fill="url(#playGradSquircle)" filter="url(#shadowSquircle)" />
</svg>