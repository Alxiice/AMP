name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: amp/requirements.lock

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r amp/requirements.lock

      - name: Run Ruff linter
        run: ruff check amp/backend/

      - name: Run unit tests with coverage
        working-directory: amp
        run: python -m pytest -m "not integration" --cov=backend --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: amp/coverage.xml
          fail_ci_if_error: false
